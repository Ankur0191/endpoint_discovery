name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python modules
        run: python -m py_compile endpoint_mapper.py intelligence_report.py dashboard.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -t .
